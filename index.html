<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建邦哥的独立站</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        .navbar { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-weight: bold; font-size: 1.2em; }
        .hero { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .hero h1 { margin: 0 0 10px 0; }
        .hero p { margin: 0; opacity: 0.9; }
        .products { padding: 20px; }
        .card { background: #fff; border-radius: 12px; display: flex; align-items: center; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .card-info h3 { margin: 0 0 5px 0; font-size: 1.1em; }
        .card-info p { margin: 0 0 10px 0; color: #777; font-size: 0.9em; }
        .btn { background: #667eea; color: #fff; border: none; padding: 8px 15px; border-radius: 20px; font-size: 0.9em; cursor: pointer; }
        .btn:active { background: #5a6fd6; }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="navbar">
        <div class="logo">建邦小铺</div>
        <div>🛒 <span id="cart-count">0</span>件 | 总计: ¥<span id="total-price">0</span></div>
    </div>

    <!-- 欢迎横幅 -->
    <div class="hero">
        <h1>欢迎来到建邦哥的独立站</h1>
        <p>这里是我的商品展示区</p>
    </div>

    <!-- 商品列表 -->
<div class="products">
    <!-- 商品1 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=150&q=80" alt="商品图片">
        <div class="card-info">
            <h3>神秘盲盒</h3>
            <p>建邦哥的秘密武器</p>
            <p style="color: #ff4d4f; font-weight: bold; margin: 5px 0;">¥ 99</p>
            <button class="btn" data-price="99">加入购物车</button>
        </div>
    </div>
    <!-- 商品2 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150&q=80" alt="商品图片">
        <div class="card-info">
            <h3>典藏版源码</h3>
            <p>纯手工敲出来的</p>
            <p style="color: #ff4d4f; font-weight: bold; margin: 5px 0;">¥ 199</p>
            <button class="btn" data-price="199">加入购物车</button>
        </div>
    </div>
    <!-- 商品3：电视机 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=150&q=80" alt="电视机">
        <div class="card-info">
            <h3>高清智能电视机</h3>
            <p>家庭影院必备 | 55英寸</p>
            <p style="color: #ff4d4f; font-weight: bold; margin: 5px 0;">¥ 2999</p>
            <button class="btn" data-price="2999">加入购物车</button>
        </div>
    </div>
    <!-- 商品4：广告机 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1533743983669-94fa5c4338ec?w=150&q=80" alt="广告机">
        <div class="card-info">
            <h3>立式广告机</h3>
            <p>商超吸睛利器 | 65英寸</p>
            <p style="color: #ff4d4f; font-weight: bold; margin: 5px 0;">¥ 4999</p>
            <button class="btn" data-price="4999">加入购物车</button>
        </div>
    </div>
    <!-- 商品5：会议机 -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?w=150&q=80" alt="会议机">
        <div class="card-info">
            <h3>智能会议一体机</h3>
            <p>高效办公大屏 | 75英寸</p>
            <p style="color: #ff4d4f; font-weight: bold; margin: 5px 0;">¥ 7999</p>
            <button class="btn" data-price="7999">加入购物车</button>
        </div>
    </div>
</div> <!-- 整个商品大盒子结束 -->
    <!-- 核心交互代码 -->
   <script>
    const countElement = document.getElementById('cart-count');
    const totalPriceElement = document.getElementById('total-price');
    const addButtons = document.querySelectorAll('.btn');
    
    let totalCount = 0;
    let totalPrice = 0;

    addButtons.forEach(button => {
        button.addEventListener('click', function() {
            // 1. 件数加 1
            totalCount++;
            countElement.innerText = totalCount;

            // 2. 获取这个按钮身上的价格，并加到总价里
            const price = parseInt(this.getAttribute('data-price')) || 0;
            totalPrice += price;
            totalPriceElement.innerText = totalPrice;

            // 3. 弹窗提示
            alert('✅ 已加入购物车！\n当前共 ' + totalCount + ' 件商品\n总价：¥ ' + totalPrice);
        });
    });
</script>
