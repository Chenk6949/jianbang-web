
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101828">
<title>S.J 思晶 | 智能科技生活馆</title>

<style>
:root{
  --blue:#2563eb;
  --dark:#101828;
  --gray:#667085;
  --bg:#f7f9fc;
  --line:#e9edf3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--dark);
}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
}

/* 顶部导航 */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:1200px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.5px;
}
.logo span{color:var(--blue)}
.cart-trigger{
  background:#eff6ff;
  border:0;
  border-radius:30px;
  padding:11px 17px;
  color:var(--blue);
  font-weight:700;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* 品牌横幅 */
.hero{
  background:linear-gradient(125deg,#101828,#1d4ed8);
  border-radius:24px;
  color:white;
  padding:55px 35px;
  position:relative;
  overflow:hidden;
}
.hero:after{
  content:"";
  position:absolute;
  width:270px;
  height:270px;
  border:45px solid #ffffff12;
  border-radius:50%;
  right:-80px;
  top:-100px;
  pointer-events:none;
}
.hero small{
  color:#93c5fd;
  font-weight:700;
  letter-spacing:3px;
}
.hero h1{
  font-size:clamp(30px,6vw,50px);
  margin:18px 0;
  letter-spacing:-1px;
}
.hero p{
  color:#cbd5e1;
  font-size:14px;
  line-height:1.9;
}
.hero button{
  position:relative;
  z-index:1;
  margin-top:15px;
  background:white;
  color:#1d4ed8;
  border:0;
  padding:13px 24px;
  border-radius:10px;
  font-weight:800;
}

/* 商品搜索 */
.section-title{
  margin:38px 0 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.section-title h2{margin:0;font-size:23px}
.section-title span{font-size:12px;color:var(--gray)}
.search{
  width:100%;
  padding:15px 18px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:white;
}
.search:focus{border-color:var(--blue)}
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:17px 0;
}
.category{
  border:1px solid var(--line);
  background:white;
  padding:10px 19px;
  border-radius:30px;
  white-space:nowrap;
  color:var(--gray);
}
.category.active{
  background:var(--dark);
  color:white;
  border-color:var(--dark);
}

/* 商品卡片 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:20px;
}
.product{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  transition:.25s;
}
.product:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px #10182812;
}
.product img{
  width:100%;
  height:205px;
  object-fit:cover;
  background:#f1f5f9;
}
.product-body{padding:17px}
.tag{
  font-size:11px;
  color:var(--blue);
  background:#eff6ff;
  padding:5px 9px;
  border-radius:5px;
}
.product h3{
  margin:13px 0 7px;
  font-size:16px;
}
.desc{
  font-size:12px;
  color:var(--gray);
  min-height:30px;
  line-height:1.6;
}
.price{
  color:#ef4444;
  font-size:22px;
  font-weight:850;
}
.product-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}
.add,.detail{
  border:0;
  padding:11px;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
}
.add{
  flex:1;
  background:var(--blue);
  color:white;
}
.detail{
  background:#f2f4f7;
  color:var(--dark);
}

/* 弹窗 */
.overlay{
  position:fixed;
  inset:0;
  background:#10182880;
  z-index:100;
  display:none;
}
.overlay.show{display:block}
.drawer{
  position:fixed;
  right:0;
  top:0;
  height:100%;
  height:100dvh;
  width:min(430px,100%);
  background:white;
  z-index:101;
  transform:translateX(105%);
  transition:.3s;
  display:flex;
  flex-direction:column;
  box-shadow:-10px 0 35px #0001;
}
.drawer.show{transform:translateX(0)}
.drawer-header{
  padding:23px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}
.drawer-header h2{margin:0}
.close{
  border:0;
  background:#f2f4f7;
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
}
.cart-list{
  flex:1;
  overflow:auto;
  padding:20px;
}
.cart-row{
  display:flex;
  gap:13px;
  margin-bottom:20px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.cart-row img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}
.cart-row h4{margin:0 0 8px;font-size:14px}
.cart-row p{margin:0;color:#ef4444;font-weight:800}
.qty{
  display:flex;
  align-items:center;
  gap:13px;
  margin-top:10px;
}
.qty button{
  border:1px solid var(--line);
  background:white;
  width:27px;
  height:27px;
  border-radius:6px;
}
.qty .remove{
  margin-left:auto;
  width:auto;
  color:#ef4444;
  border:0;
  font-size:12px;
}
.drawer-footer{
  border-top:1px solid var(--line);
  padding:22px;
}
.total{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  margin-bottom:20px;
}
.total strong{color:#ef4444;font-size:23px}
.checkout{
  width:100%;
  padding:16px;
  background:var(--blue);
  color:white;
  border:0;
  border-radius:12px;
  font-weight:800;
}

/* 商品详情 */
.detail-modal{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(420px,90%);
  max-height:85vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  z-index:102;
  padding:20px;
  display:none;
}
.detail-modal.show{display:block}
.detail-modal img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
}
.detail-modal p{color:var(--gray);line-height:1.8}
.detail-modal .close{float:right;margin-bottom:10px}
.empty{
  text-align:center;
  padding:50px 10px;
  color:var(--gray);
}
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#101828;
  color:white;
  padding:13px 22px;
  border-radius:12px;
  z-index:200;
  transition:.3s;
  opacity:0;
  font-size:13px;
  text-align:center;
  max-width:90%;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
footer{
  text-align:center;
  padding:45px 20px;
  margin-top:50px;
  color:#98a2b3;
  font-size:12px;
  border-top:1px solid var(--line);
}
@media(max-width:500px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }
  .product img{height:140px}
  .product-body{padding:11px}
  .product h3{font-size:13px}
  .price{font-size:18px}
  .product-actions{flex-direction:column}
  .hero{padding:38px 24px}
}
</style>
</head>

<body>

<header>
  <nav class="nav">
    <div class="logo">S.J<span> 思晶</span></div>
    <button class="cart-trigger" onclick="openCart()">
      🛒 购物车 (<span id="cartCount">0</span>)
    </button>
  </nav>
</header>

<main class="container">

<section class="hero">
  <small>S.J · SMART LIVING</small>
  <h1>智享生活，晶彩未来。</h1>
  <p>
    探索智能科技与品质好物。<br>
    从日常家居到商业办公，让创新融入每一刻。
  </p>
  <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
    探索精选好物 →
  </button>
</section>

<section id="shop">
  <div class="section-title">
    <h2>思晶精选</h2>
    <span id="resultCount"></span>
  </div>

  <input
    class="search"
    id="searchInput"
    type="search"
    aria-label="搜索商品"
    placeholder="🔍 搜索你感兴趣的商品..."
    oninput="renderProducts()"
  >

  <div class="categories" id="categories"></div>
  <div class="grid" id="productGrid"></div>
</section>

</main>

<footer>
  <div class="logo">S.J<span> 思晶</span></div>
  <p>SMART LIVING · BETTER FUTURE</p>
  <p>智享生活 · 晶彩未来</p>
  <p>© 2026 S.J 思晶 · All Rights Reserved.</p>
  <p>当前为演示商城，暂不支持真实支付。</p>
</footer>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<aside class="drawer" id="drawer" role="dialog" aria-label="购物车" aria-modal="true">
  <div class="drawer-header">
    <h2>我的购物车 🛒</h2>
    <button class="close" onclick="closeAll()" aria-label="关闭购物车">×</button>
  </div>
  <div class="cart-list" id="cartList"></div>
  <div class="drawer-footer">
    <div class="total">
      <span>商品合计</span>
      <strong id="cartTotal">¥0</strong>
    </div>
    <button class="checkout" id="checkoutBtn" onclick="checkout()">
      确认下单 →
    </button>
  </div>
</aside>

<div class="detail-modal" id="detailModal" role="dialog" aria-label="商品详情" aria-modal="true">
  <button class="close" onclick="closeAll()" aria-label="关闭详情">×</button>
  <div id="detailContent"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ==========================================
   S.J 思晶 - 商品数据
   ========================================== */

/*
  广告机使用内嵌 SVG 产品插画。
  不依赖第三方图片服务器。
*/
const advertisingImage = "data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#edf4ff"/>
    <stop offset="1" stop-color="#dbeafe"/>
  </linearGradient>
  <linearGradient id="screen" x2="1" y2="1">
    <stop stop-color="#0f172a"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="poster" x2="0" y2="1">
    <stop stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#1d4ed8"/>
  </linearGradient>
</defs>

<rect width="600" height="600" fill="url(#bg)"/>
<circle cx="470" cy="100" r="145" fill="#fff" opacity=".4"/>
<ellipse cx="300" cy="555" rx="155" ry="20" fill="#94a3b8" opacity=".3"/>

<!-- 广告机机身 -->
<rect x="190" y="48" width="220" height="470" rx="14" fill="#111827"/>
<rect x="199" y="57" width="202" height="442" rx="5" fill="url(#screen)"/>

<!-- 屏幕内容 -->
<rect x="207" y="65" width="186" height="425" rx="3" fill="url(#poster)"/>
<circle cx="350" cy="140" r="85" fill="#fff" opacity=".12"/>
<circle cx="240" cy="310" r="95" fill="#fff" opacity=".09"/>

<text x="300" y="115" fill="#fff" font-family="Arial" font-size="16"
font-weight="bold" text-anchor="middle" letter-spacing="3">S.J DISPLAY</text>

<path d="M235 180 L365 180 L340 270 L260 270 Z" fill="#fff" opacity=".14"/>
<rect x="242" y="205" width="116" height="7" rx="3" fill="#fff" opacity=".8"/>
<rect x="260" y="225" width="80" height="5" rx="2" fill="#fff" opacity=".5"/>

<text x="300" y="345" fill="white" font-family="Arial"
font-size="37" font-weight="bold" text-anchor="middle">65 INCH</text>
<text x="300" y="374" fill="#dbeafe" font-family="Arial"
font-size="15" text-anchor="middle" letter-spacing="3">DIGITAL SIGNAGE</text>

<rect x="257" y="405" width="86" height="27" rx="13" fill="#fff"/>
<text x="300" y="423" font-family="Arial" font-size="11"
font-weight="bold" fill="#1d4ed8" text-anchor="middle">S.J TECH</text>

<!-- 底座 -->
<rect x="275" y="518" width="50" height="16" rx="3" fill="#334155"/>
<path d="M265 532 H335 L370 548 H230 Z" fill="#111827"/>
<rect x="225" y="547" width="150" height="7" rx="3" fill="#334155"/>
</svg>
`);

const products=[
  {
    id:1,
    name:"思晶神秘盲盒",
    category:"创意好物",
    price:99,
    desc:"每一次开启，都是一场未知惊喜。",
    image:"https://images.unsplash.com/photo-1607082349566-187342175e2f?w=600&q=85",
    detail:"S.J 思晶创意礼盒演示商品。具体内容以正式商品说明为准。"
  },
  {
    id:2,
    name:"典藏版网站源码",
    category:"数字产品",
    price:199,
    desc:"为热爱编程与创造的你准备。",
    image:"https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=600&q=85",
    detail:"网站开发学习资源与示例源码，适合了解网页结构及前端设计。"
  },
  {
    id:3,
    name:"55英寸智能电视",
    category:"智能家电",
    price:2999,
    desc:"大屏视界，沉浸式家庭娱乐。",
    image:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=600&q=85",
    detail:"55英寸智能电视演示商品。实际品牌、配置及售后以正式商品信息为准。"
  },
  {
    id:4,
    name:"65英寸立式广告机",
    category:"商用设备",
    price:4999,
    desc:"高清数字展示，让品牌更出众。",
    image:advertisingImage,
    detail:"65英寸立式数字广告机，适用于商场、展厅、企业及各类商业展示场景。图片为产品示意插画，实际配置以正式商品信息为准。"
  },
  {
    id:5,
    name:"75英寸智能会议机",
    category:"商用设备",
    price:7999,
    desc:"高效协作，开启智慧办公。",
    image:"https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=600&q=85",
    detail:"面向会议展示与办公协作场景的智能大屏演示商品。"
  },
  {
    id:6,
    name:"智能桌面音箱",
    category:"智能家电",
    price:399,
    desc:"好声音，为生活增添氛围。",
    image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=600&q=85",
    detail:"简约桌面音箱，适合日常音乐欣赏与居家使用。"
  }
];

/* ==========================================
   购物车数据
   ========================================== */

let activeCategory="全部商品";
let cart=[];

const STORAGE_KEY="sj_cart_v1";

/* 兼容旧版建邦小铺购物车 */
try{
  let saved=localStorage.getItem(STORAGE_KEY);

  if(!saved){
    saved=localStorage.getItem("jb_cart_v2");
  }

  const parsed=JSON.parse(saved||"[]");

  if(Array.isArray(parsed)){
    cart=parsed.filter(item=>
      products.some(p=>p.id===item.id)&&
      Number.isSafeInteger(item.quantity)&&
      item.quantity>0&&
      item.quantity<=99
    ).map(item=>({
      id:item.id,
      quantity:item.quantity
    }));
  }
}catch(e){
  cart=[];
}

const money=n=>"¥"+n.toLocaleString("zh-CN");

function saveCart(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(cart));
  }catch(e){
    console.warn("本地购物车保存失败",e);
  }
  updateCount();
}

function updateCount(){
  document.getElementById("cartCount").textContent=
    cart.reduce((sum,item)=>sum+item.quantity,0);
}

/* ==========================================
   商品分类
   ========================================== */

function renderCategories(){
  const categories=[
    "全部商品",
    ...new Set(products.map(p=>p.category))
  ];

  const box=document.getElementById("categories");
  box.replaceChildren();

  categories.forEach(c=>{
    const btn=document.createElement("button");

    btn.className="category"+(c===activeCategory?" active":"");
    btn.textContent=c;
    btn.setAttribute("aria-pressed",String(c===activeCategory));

    btn.onclick=()=>{
      activeCategory=c;
      renderCategories();
      renderProducts();
    };

    box.appendChild(btn);
  });
}

/* ==========================================
   商品列表
   ========================================== */

function renderProducts(){
  const keyword=document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const filtered=products.filter(p=>
    (activeCategory==="全部商品"||p.category===activeCategory)&&
    (
      p.name.toLowerCase().includes(keyword)||
      p.desc.toLowerCase().includes(keyword)
    )
  );

  document.getElementById("resultCount").textContent=
    filtered.length+" 件商品";

  const grid=document.getElementById("productGrid");
  grid.replaceChildren();

  if(!filtered.length){
    grid.innerHTML='<div class="empty">没有找到相关商品，试试其他关键词吧。</div>';
    return;
  }

  filtered.forEach(p=>{
    const card=document.createElement("article");
    card.className="product";

    const img=document.createElement("img");
    img.src=p.image;
    img.alt=p.name;
    img.loading="lazy";

    img.onerror=function(){
      this.onerror=null;
      this.src=advertisingImage;
    };

    const body=document.createElement("div");
    body.className="product-body";

    const tag=document.createElement("span");
    tag.className="tag";
    tag.textContent=p.category;

    const title=document.createElement("h3");
    title.textContent=p.name;

    const desc=document.createElement("p");
    desc.className="desc";
    desc.textContent=p.desc;

    const price=document.createElement("div");
    price.className="price";
    price.textContent=money(p.price);

    const actions=document.createElement("div");
    actions.className="product-actions";

    const detail=document.createElement("button");
    detail.className="detail";
    detail.textContent="查看详情";
    detail.onclick=()=>showDetail(p.id);

    const add=document.createElement("button");
    add.className="add";
    add.textContent="＋ 加入购物车";
    add.onclick=()=>addCart(p.id);

    actions.append(detail,add);
    body.append(tag,title,desc,price,actions);
    card.append(img,body);
    grid.appendChild(card);
  });
}

/* ==========================================
   消息提示
   ========================================== */

let toastTimer;

function toast(message){
  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2300);
}

/* ==========================================
   购物车功能
   ========================================== */

function addCart(id){
  const item=cart.find(i=>i.id===id);

  if(item){
    if(item.quantity>=99){
      toast("单件商品最多添加99件");
      return;
    }
    item.quantity++;
  }else{
    cart.push({id,quantity:1});
  }

  saveCart();
  renderCart();
  toast("✓ 已成功加入购物车");
}

function changeQty(id,delta){
  const item=cart.find(i=>i.id===id);
  if(!item)return;

  item.quantity+=delta;

  if(item.quantity>99)item.quantity=99;

  if(item.quantity<=0){
    cart=cart.filter(i=>i.id!==id);
  }

  saveCart();
  renderCart();
}

function removeItem(id){
  cart=cart.filter(i=>i.id!==id);

  saveCart();
  renderCart();
  toast("商品已移除");
}

function cartTotal(){
  return cart.reduce((sum,item)=>{
    const p=products.find(p=>p.id===item.id);
    return sum+(p?p.price*item.quantity:0);
  },0);
}

function renderCart(){
  const list=document.getElementById("cartList");
  list.replaceChildren();

  if(!cart.length){
    list.innerHTML=`
      <div class="empty">
        🛍️
        <p>购物车还是空的</p>
        <small>去挑选一些喜欢的商品吧</small>
      </div>
    `;
  }

  cart.forEach(item=>{
    const p=products.find(p=>p.id===item.id);
    if(!p)return;

    const row=document.createElement("div");
    row.className="cart-row";

    const img=document.createElement("img");
    img.src=p.image;
    img.alt=p.name;

    const info=document.createElement("div");
    info.style.flex="1";

    const title=document.createElement("h4");
    title.textContent=p.name;

    const price=document.createElement("p");
    price.textContent=money(p.price*item.quantity);

    const qty=document.createElement("div");
    qty.className="qty";

    const minus=document.createElement("button");
    minus.textContent="−";
    minus.setAttribute("aria-label","减少"+p.name+"数量");
    minus.onclick=()=>changeQty(p.id,-1);

    const count=document.createElement("span");
    count.textContent=item.quantity;

    const plus=document.createElement("button");
    plus.textContent="+";
    plus.disabled=item.quantity>=99;
    plus.setAttribute("aria-label","增加"+p.name+"数量");
    plus.onclick=()=>changeQty(p.id,1);

    const remove=document.createElement("button");
    remove.className="remove";
    remove.textContent="删除";
    remove.onclick=()=>removeItem(p.id);

    qty.append(minus,count,plus,remove);
    info.append(title,price,qty);
    row.append(img,info);
    list.appendChild(row);
  });

  document.getElementById("cartTotal").textContent=money(cartTotal());

  document.getElementById("checkoutBtn").disabled=!cart.length;
}

/* ==========================================
   弹窗控制
   ========================================== */

function showOverlay(){
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}

function openCart(){
  closeAll();
  renderCart();
  showOverlay();
  document.getElementById("drawer").classList.add("show");
  document.querySelector("#drawer .close").focus();
}

function showDetail(id){
  const p=products.find(p=>p.id===id);
  if(!p)return;

  closeAll();

  const box=document.getElementById("detailContent");
  box.replaceChildren();

  const img=document.createElement("img");
  img.src=p.image;
  img.alt=p.name;

  const title=document.createElement("h2");
  title.textContent=p.name;

  const desc=document.createElement("p");
  desc.textContent=p.detail;

  const price=document.createElement("div");
  price.className="price";
  price.textContent=money(p.price);

  const add=document.createElement("button");
  add.className="checkout";
  add.style.marginTop="20px";
  add.textContent="加入购物车";

  add.onclick=()=>{
    addCart(p.id);
    closeAll();
  };

  box.append(img,title,desc,price,add);

  showOverlay();
  document.getElementById("detailModal").classList.add("show");
  document.querySelector("#detailModal .close").focus();
}

function closeAll(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("drawer").classList.remove("show");
  document.getElementById("detailModal").classList.remove("show");
  document.body.style.overflow="";
}

/* ==========================================
   思晶模拟订单系统
   ========================================== */

function checkout(){
  if(!cart.length){
    toast("请先添加商品");
    return;
  }

  const total=cartTotal();
  const orderId="SJ"+Date.now();

  const confirmed=confirm(
    "S.J 思晶 · 订单确认\n\n"+
    "商品合计："+money(total)+"\n\n"+
    "确认提交演示订单？\n"+
    "注意：不会产生真实支付或发货。"
  );

  if(!confirmed)return;

  cart=[];
  saveCart();
  renderCart();
  closeAll();

  alert(
    "🎉 S.J 思晶\n"+
    "演示订单创建成功！\n\n"+
    "订单编号："+orderId+"\n"+
    "订单金额："+money(total)+"\n\n"+
    "感谢体验思晶商城！\n"+
    "本次为模拟结算，没有实际扣款或发货。"
  );
}

/* 快捷关闭弹窗 */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeAll();
});

/* 页面初始化 */
renderCategories();
renderProducts();
updateCount();

</script>
