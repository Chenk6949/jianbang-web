<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建邦哥的独立站</title>
    <style>
        /* 这里面是 CSS，用来让网页变好看的 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f6; 
            color: #333; 
        }
        /* 顶部导航栏 */
        .navbar { 
            background: #fff; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .logo { font-weight: bold; font-size: 1.2em; }
        /* 主视觉横幅 */
        .hero { 
            text-align: center; 
            padding: 40px 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
        }
        .hero h1 { margin: 0 0 10px 0; font-size: 1.8em; }
        /* 商品列表区 */
        .products { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        /* 商品卡片 */
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .card img { 
            width: 80px; 
            height: 80px; 
            border-radius: 8px; 
            object-fit: cover; 
            margin-right: 15px; 
        }
        .card-info { flex: 1; }
        .card-info h3 { margin: 0 0 5px 0; font-size: 1.1em; }
        .card-info p { margin: 0 0 10px 0; color: #888; font-size: 0.9em; }
        /* 按钮 */
        .btn { 
            background: #667eea; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 0.9em; 
            cursor: pointer; 
        }
        .btn:active { background: #5a6fd6; }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="navbar">
        <div class="logo">建邦小铺</div>
        <div>🛒 购物车</div>
    </div>

    <!-- 欢迎横幅 -->
    <div class="hero">
        <h1>欢迎来到建邦哥的独立站</h1>
        <p>这里是我的商品展示区</p>
    </div>

    <!-- 商品列表 -->
    <div class="products">
        <!-- 商品1 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=150&q=80" alt="商品图片">
            <div class="card-info">
                <h3>神秘盲盒</h3>
                <p>建邦哥的秘密武器</p>
                <button class="btn">加入购物车</button>
            </div>
        </div>
        <!-- 商品2 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150&q=80" alt="商品图片">
            <div class="card-info">
                <h3>典藏版源码</h3>
                <p>纯手工敲出来的</p>
                <button class="btn" onclick="alert('已加入购物车！')">加入购物车</button>
            </div>
        </div>
    </div>
 <script>
    // 1. 找到右上角的购物车数字标签
    const countElement = document.getElementById('cart-count');
    
    // 2. 获取页面上所有 class 为 "btn" 的按钮
    const addButtons = document.querySelectorAll('.btn');
    
    // 3. 给每个按钮绑定点击事件
    addButtons.forEach(button => {
        button.addEventListener('click', () => {
            // 获取当前数字（如果为空就当0处理）
            let currentCount = parseInt(countElement.innerText) || 0;
            // 数字加1
            currentCount++;
            // 更新到页面上
            countElement.innerText = currentCount;
            // 弹出提示
            alert('✅ 已加入购物车！\n当前购物车共有 ' + currentCount + ' 件商品');
        });
    });
</script>
</body>
</html>
